name: Compact layout validation (fork-only)

on:
  workflow_dispatch:
    inputs:
      regression_control:
        description: Confirm the position-only relayout test fails on the reviewed baseline
        type: boolean
        default: false
      render_layouts:
        description: Render compact layouts for visual inspection
        type: boolean
        default: false
      full_suite:
        description: Run the full suite after the focused tests
        type: boolean
        default: false
      compile_apk:
        description: Compile a debug APK after the tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: compact-public-validation-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.repository == 'MichaelSpece/mobile' && github.ref == 'refs/heads/codex/compact-public-validation-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: 0e2f87ce91194b8d289addecedfb504b2746f78c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify candidate source
        run: |
          git diff --exit-code "$SOURCE_SHA" -- . ':!.github/workflows/build.yml'
          mkdir -p build/validation
          git rev-parse "$SOURCE_SHA" | tee build/validation/revision.txt

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: inputs.compile_apk
        with:
          java-version: 17
          distribution: temurin

      - name: Install pinned Flutter
        run: |
          git clone --depth=1 --branch=3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = ab2912035e160d9cad6306df307576da6128ebdb
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version | tee build/validation/flutter.txt

      - name: Install SQLite
        run: sudo apt-get -y install libsqlite3-0 libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        id: generate
        run: dart run build_runner build

      - name: Check formatting
        run: |
          mapfile -t files < <(git diff --name-only 7b32d80f7f7f662a59f57697c8d85c2540ea9ba8 "$SOURCE_SHA" -- '*.dart')
          dart format --output=none --set-exit-if-changed "${files[@]}"

      - name: Analyze
        id: analyze
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: flutter analyze --no-pub 2>&1 | tee build/validation/analyze.log

      - name: Focused tests
        id: focused
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        run: |
          flutter test --no-pub --concurrency=1 --reporter=expanded \
            test/test_helpers_test.dart \
            test/widgets/game_layout_test.dart test/widgets/clock_test.dart \
            test/widgets/android_gesture_exclusion_test.dart test/widgets/board_test.dart \
            test/widgets/bottom_bar_test.dart \
            test/view/game/game_player_test.dart test/view/game/game_screen_test.dart \
            test/view/game/move_expiration_test.dart \
            test/view/correspondence/offline_correspondence_game_screen_test.dart \
            test/view/offline_computer/offline_computer_game_screen_test.dart \
            test/view/over_the_board/over_the_board_screen_test.dart \
            test/view/watch/tv_screen_test.dart \
            2>&1 | tee build/validation/focused.log

      - name: Confirm regression control
        if: ${{ success() && inputs.regression_control }}
        run: |
          file=lib/src/widgets/game_layout.dart
          trap 'git restore --source="$SOURCE_SHA" -- "$file"' EXIT
          git restore --source=77af629d6754ae74b0ccb95698c887282a3b4abc -- "$file"
          set +e
          flutter test --no-pub --concurrency=1 --reporter=expanded \
            test/widgets/android_gesture_exclusion_test.dart \
            --plain-name 'refreshes edge protection when only a player table relayouts' \
            2>&1 | tee build/validation/regression-control.log
          result=${PIPESTATUS[0]}
          set -e
          git restore --source="$SOURCE_SHA" -- "$file"
          test "$result" -eq 1
          grep -F 'A position-only table relayout must refresh native rectangles.' build/validation/regression-control.log
          git diff --exit-code "$SOURCE_SHA" -- "$file"

      - name: Render requested layouts
        if: ${{ !cancelled() && steps.focused.outcome == 'success' && inputs.render_layouts }}
        run: |
          flutter test --no-pub --concurrency=1 --reporter=expanded \
            --dart-define=LAYOUT_GOLDENS=true --update-goldens \
            test/widgets/game_layout_test.dart test/view/game/game_player_test.dart \
            test/widgets/bottom_bar_test.dart \
            test/widgets/android_gesture_exclusion_test.dart \
            test/view/game/game_screen_test.dart \
            test/view/offline_computer/offline_computer_game_screen_test.dart \
            test/view/over_the_board/over_the_board_screen_test.dart \
            --name 'compact|adaptive crazyhouse pockets|only a player table relayouts' \
            2>&1 | tee build/validation/renders.log

      - name: Full suite
        if: ${{ success() && inputs.full_suite }}
        run: flutter test --no-pub --concurrency=1 --reporter=expanded 2>&1 | tee build/validation/full-suite.log

      - name: Compile debug APK
        if: ${{ success() && inputs.compile_apk }}
        run: |
          flutter build apk --debug --no-pub 2>&1 | tee build/validation/compile.log
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/validation/apk.sha256

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compact-layout-${{ github.sha }}
          path: |
            build/validation/
            build/compact-layout/
          if-no-files-found: error
          retention-days: 1

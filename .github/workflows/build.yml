name: Compact layout validation (temporary)

on:
  workflow_dispatch:
    inputs:
      render_layouts:
        description: Render compact-layout screenshots for visual inspection
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: compact-layout-validation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.repository == 'MichaelSpece/mobile' && github.ref == 'refs/heads/codex/compact-layout-validation-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Install SQLite
        run: sudo apt-get -y install libsqlite3-0 libsqlite3-dev

      - name: Record source and toolchain
        run: |
          mkdir -p build/validation
          git rev-parse HEAD | tee build/validation/revision.txt
          flutter --version | tee build/validation/flutter.txt

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        id: generate
        run: dart run build_runner build

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          test/test_helpers.dart test/test_helpers_test.dart test/test_provider_scope.dart
          test/view/game/game_screen_test.dart
          test/view/offline_computer/offline_computer_game_screen_test.dart
          test/view/over_the_board/over_the_board_screen_test.dart

      - name: Analyze
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: flutter analyze --no-pub 2>&1 | tee build/validation/analyze.log

      - name: Focused tests
        id: focused
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: |
          flutter test --no-pub --concurrency=1 --reporter=expanded \
            test/test_helpers_test.dart \
            test/view/game/game_screen_test.dart \
            test/view/offline_computer/offline_computer_game_screen_test.dart \
            test/view/over_the_board/over_the_board_screen_test.dart \
            2>&1 | tee build/validation/focused.log

      - name: Render requested layouts
        if: ${{ !cancelled() && steps.generate.outcome == 'success' && inputs.render_layouts }}
        run: |
          flutter test --no-pub --concurrency=1 --reporter=expanded \
            --dart-define=LAYOUT_GOLDENS=true --update-goldens \
            test/view/game/game_screen_test.dart \
            test/view/offline_computer/offline_computer_game_screen_test.dart \
            test/view/over_the_board/over_the_board_screen_test.dart \
            --name 'compact post-startup|compact active game survives rotation' \
            2>&1 | tee build/validation/renders.log

      - name: Full suite for shared test surface
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        run: flutter test --no-pub --concurrency=1 --reporter=expanded 2>&1 | tee build/validation/full-suite.log

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compact-layout-${{ github.sha }}
          path: |
            build/validation/
            build/compact-layout/
          if-no-files-found: error
          retention-days: 1

name: Compact layout validation (temporary)

on:
  workflow_dispatch:
    inputs:
      verify_countdown_regression:
        description: Check the new countdown test against the pre-fix player layout
        type: boolean
        default: false
      render_layouts:
        description: Render compact-layout screenshots for visual inspection
        type: boolean
        default: false
      full_suite:
        description: Run the full suite in addition to the affected widget suites
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: compact-layout-validation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.repository == 'MichaelSpece/mobile' && github.ref == 'refs/heads/codex/compact-layout-validation-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Install SQLite
        run: sudo apt-get -y install libsqlite3-0 libsqlite3-dev

      - name: Record source and toolchain
        run: |
          mkdir -p build/validation
          git rev-parse HEAD | tee build/validation/revision.txt
          flutter --version | tee build/validation/flutter.txt

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        id: generate
        run: dart run build_runner build

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/src/widgets/game_layout.dart lib/src/widgets/pockets.dart lib/src/widgets/clock.dart
          lib/src/widgets/move_list.dart lib/src/view/game/game_player.dart
          lib/src/view/offline_computer/offline_computer_game_screen.dart
          test/test_helpers.dart test/test_helpers_test.dart test/test_provider_scope.dart
          test/widgets/game_layout_test.dart test/widgets/clock_test.dart
          test/view/game/game_screen_test.dart
          test/view/game/move_expiration_test.dart
          test/view/offline_computer/offline_computer_game_screen_test.dart
          test/view/over_the_board/over_the_board_screen_test.dart

      - name: Analyze
        id: analyze
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: flutter analyze --no-pub 2>&1 | tee build/validation/analyze.log

      - name: Reproduce countdown reset before the fix
        id: regression
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' && inputs.verify_countdown_regression }}
        run: |
          test "$(git rev-parse HEAD^)" = d377a8fac558a04814c7733391d4bb3360a79443
          source=lib/src/view/game/game_player.dart
          saved=$(mktemp)
          cp "$source" "$saved"
          trap 'cp "$saved" "$source"; rm -f "$saved"' EXIT
          git show "HEAD^:$source" > "$source"
          if flutter test --no-pub --concurrency=1 --reporter=expanded \
            test/view/game/move_expiration_test.dart --name 'GamePlayer responsive countdown' \
            2>&1 | tee build/validation/countdown-before.log; then
            echo 'The countdown regression did not fail against the pre-fix layout.'
            exit 1
          fi
          grep -q 'Expected: exactly one matching candidate' build/validation/countdown-before.log
          grep -q '7 seconds to play the first move' build/validation/countdown-before.log

      - name: Focused tests
        id: focused
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' && steps.regression.outcome != 'failure' }}
        run: |
          flutter test --no-pub --concurrency=1 --reporter=expanded \
            test/test_helpers_test.dart \
            test/widgets/game_layout_test.dart test/widgets/clock_test.dart \
            test/view/game/game_screen_test.dart \
            test/view/game/move_expiration_test.dart \
            test/view/offline_computer/offline_computer_game_screen_test.dart \
            test/view/over_the_board/over_the_board_screen_test.dart \
            2>&1 | tee build/validation/focused.log

      - name: Render requested layouts
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' && steps.regression.outcome != 'failure' && inputs.render_layouts }}
        run: |
          flutter test --no-pub --concurrency=1 --reporter=expanded \
            --dart-define=LAYOUT_GOLDENS=true --update-goldens \
            test/widgets/game_layout_test.dart \
            test/view/game/game_screen_test.dart \
            test/view/offline_computer/offline_computer_game_screen_test.dart \
            test/view/over_the_board/over_the_board_screen_test.dart \
            --name 'compact post-startup|compact active game survives rotation|adaptive crazyhouse pockets' \
            2>&1 | tee build/validation/renders.log

      - name: Full suite for shared test surface
        if: ${{ success() && inputs.full_suite }}
        run: flutter test --no-pub --concurrency=1 --reporter=expanded 2>&1 | tee build/validation/full-suite.log

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compact-layout-${{ github.sha }}
          path: |
            build/validation/
            build/compact-layout/
          if-no-files-found: error
          retention-days: 1
